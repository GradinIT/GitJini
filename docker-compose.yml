services:
  lus:
    build:
      context: ./jini-example
      dockerfile: Dockerfile
    command: ["lus"]
    environment:
      - JAVA_OPTS=-Dlus.host=0.0.0.0 -Dlus.port=10999
    ports:
      - "10999:10999"
    networks:
      - jini-network

  service:
    build:
      context: ./jini-example
      dockerfile: Dockerfile
    command: ["service"]
    environment:
      - JAVA_OPTS=-Dlus.host=lus -Dlus.port=10999
    depends_on:
      - lus
    networks:
      - jini-network

  client:
    build:
      context: ./jini-example
      dockerfile: Dockerfile
    command: ["client"]
    environment:
      - JAVA_OPTS=-Dlus.host=lus -Dlus.port=10999
    depends_on:
      - service
    networks:
      - jini-network

networks:
  jini-network:
    driver: bridge
